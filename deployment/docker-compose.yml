services:
  backend:
    build:
      context: ../backend
    env_file:
      - ${CYBERNEXUS_CONFIG_FILE:-../.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MYSQL_HOST: ${MYSQL_HOST_CONTAINER:-host.docker.internal}
      MYSQL_HOST_CONTAINER: ${MYSQL_HOST_CONTAINER:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-glpi}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run start

# GLPI and MySQL remain host-managed. host.docker.internal is mapped to the
# Linux host so FastAPI can reach the configured host MySQL instance.
