<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="680" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="680" height="200" fill="#020617"/>

  <!-- Mark: squircle badge -->
  <g transform="translate(28,28)">
    <rect x="0" y="0" width="144" height="144" rx="38" fill="#0b1220" stroke="url(#mark)" stroke-width="2"/>

    <!-- risk percentile arc, sits behind the network -->
    <path d="M 24 108 A 68 68 0 0 1 120 30" fill="none" stroke="url(#mark)" stroke-width="3" stroke-linecap="round" opacity="0.45"/>

    <!-- glow behind the convergence node -->
    <circle cx="100" cy="46" r="30" fill="url(#glow)"/>

    <!-- network path forming an abstract N / convergence point -->
    <g stroke="url(#mark)" stroke-width="4" stroke-linecap="round">
      <line x1="34" y1="112" x2="72" y2="76"/>
      <line x1="72" y1="76" x2="60" y2="46"/>
      <line x1="72" y1="76" x2="100" y2="46"/>
      <line x1="100" y1="46" x2="118" y2="98"/>
    </g>
    <circle cx="34" cy="112" r="6.5" fill="#020617" stroke="url(#mark)" stroke-width="3"/>
    <circle cx="72" cy="76" r="6.5" fill="#020617" stroke="url(#mark)" stroke-width="3"/>
    <circle cx="60" cy="46" r="6.5" fill="#020617" stroke="url(#mark)" stroke-width="3"/>
    <circle cx="118" cy="98" r="6.5" fill="#020617" stroke="url(#mark)" stroke-width="3"/>
    <circle cx="100" cy="46" r="9" fill="#38bdf8" filter="url(#soft)"/>
    <circle cx="100" cy="46" r="9" fill="#e0f2fe"/>
  </g>

  <!-- Wordmark -->
  <text x="200" y="98" font-family="'Segoe UI', Arial, sans-serif" font-weight="800"
        font-size="52" letter-spacing="-1" fill="#f8fafc">Risk<tspan fill="url(#wordGrad)">Nexus</tspan></text>
  <text x="202" y="128" font-family="'Segoe UI', Arial, sans-serif" font-weight="600"
        font-size="15" letter-spacing="4" fill="#64748b">RISK INTELLIGENCE PLATFORM</text>
</svg>
